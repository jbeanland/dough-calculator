<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dough Calculator</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dough" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Dough Calculator</h1>
      <p class="subtitle">Get dem ratios</p>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
    </header>

    <main>
      <div class="toolbar">
        <label class="autolyse-toggle">
          <input type="checkbox" id="autolyse" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          Autolyse
        </label>
        <div class="toolbar-right">
        <input type="text" id="save-label-input" class="save-label-input" placeholder="Name this recipe…" autocomplete="off" />
        <button class="save-btn" id="save-btn">Save</button>
        <button class="share-btn" id="share-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span id="share-label">Share</span>
        </button>
        </div>
      </div>
      <div class="share-toast" id="share-toast" role="status" aria-live="polite"></div>

      <div id="inputs-grid">
        <p class="section-label">Input</p>
        <div class="converter">
        <unit-card label="Hydration" name="hydration_input">
          <input type="number" id="hydration_pct" value="75" step="any" autocomplete="off" data-unit="%" />
        </unit-card>

        <unit-card label="Levain" name="levain_input">
          <input type="number" id="levain_pct" value="10" step="any" autocomplete="off" data-unit="%" />
        </unit-card>

        <div class="unit-card ratio-card" id="levain_ratio_card">
          <div class="unit-header">
            <span class="unit-name">Levain Ratio</span>
          </div>
          <div class="ratio-inputs">
            <div class="ratio-field">
              <span class="ratio-label">Feed</span>
              <input type="number" id="levain_ratio_feed" value="2" step="any" autocomplete="off" />
            </div>
            <span class="ratio-sep">:</span>
            <div class="ratio-field">
              <span class="ratio-label">Water</span>
              <input type="number" id="levain_ratio_water" value="4" step="any" autocomplete="off" />
            </div>
            <span class="ratio-sep">:</span>
            <div class="ratio-field">
              <span class="ratio-label">Flour</span>
              <input type="number" id="levain_ratio_flour" value="4" step="any" autocomplete="off" />
            </div>
          </div>
        </div>

        <unit-card label="Salt" name="salt_input">
          <input type="number" id="salt_pct" value="2.5" step="any" autocomplete="off" data-unit="%" />
        </unit-card>

        <unit-card label="Total Flour" name="total_flour_input">
          <input type="number" id="total_flour_g" value="500" step="any" autocomplete="off" data-unit="g" />
        </unit-card>

        <unit-card label="Reserve Water" name="reserve_water_input" class="autolyse-input-only">
          <input type="number" id="reserve_water_pct" value="5" step="any" autocomplete="off" data-unit="%" />
        </unit-card>
        </div>
      </div>

      <div id="levain-feeding-section">
        <p class="section-label" style="margin:0;padding:0.875rem">Levain Feeding</p>
        <div id="levain-feeding-content">
          <div class="converter">
            <unit-card label="Leftover amount" name="levain_leftover_input">
              <input type="number" id="levain_leftover_input" value="30" step="any" autocomplete="off" data-unit="g" />
            </unit-card>

            <unit-card label="Starter" name="levain_feed_result">
              <span id="levain_feed_result" class="result" data-unit="g">0</span>
            </unit-card>

            <unit-card label="New Water" name="levain_water_result">
              <span id="levain_water_result" class="result" data-unit="g">0</span>
            </unit-card>

            <unit-card label="New Flour" name="levain_flour_result">
              <span id="levain_flour_result" class="result" data-unit="g">0</span>
            </unit-card>
          </div>
        </div>
      </div>

      <div id="results">
        <div class="phase-group">
          <p class="phase-label first-phase-label"></p>
          <div class="converter">
            <unit-card label="Total Weight" name="total_weight_result">
              <span id="weight_result_g" class="result" data-unit="g">0</span>
            </unit-card>

            <unit-card label="New Flour" name="flour_result">
              <span id="flour_result_g" class="result" data-unit="g">0</span>
            </unit-card>

            <unit-card label="New Water" name="water_result">
              <span id="water_result_g" class="result" data-unit="g">0</span>
            </unit-card>

            <unit-card label="Levain" name="levain_result">
              <span id="levain_result_g" class="result" data-unit="g">0</span>
            </unit-card>
          </div>
        </div>

        <div class="phase-group" id="phase-after">
          <p class="phase-label">After Autolyse</p>
          <div class="converter">
            <unit-card label="Salt" name="salt_result">
              <span id="salt_result_g" class="result" data-unit="g">0</span>
            </unit-card>

            <unit-card label="Reserve Water" name="reserve_water_result" class="autolyse-only">
              <span id="reserve_water_result_g" class="result" data-unit="g">0</span>
            </unit-card>
          </div>
        </div>
      </div>

      <div id="flours-section">
        <div class="flours-header-row">
          <button class="flours-header" id="flours-toggle" aria-expanded="false">
            <span class="section-label" style="margin:0">Flours</span>
            <svg class="flours-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button class="flour-info-tip" type="button" aria-label="We assume that your levain is made of the first flour here.">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </button>
        </div>
        <div id="flours-content" hidden>
          <div class="converter" id="flours-grid"></div>
          <div class="flours-actions">
            <button class="flour-btn flour-clear-names" id="flour-clear-names" disabled>Clear Names</button>
            <button class="flour-btn" id="flour-remove" aria-label="Remove flour">−</button>
            <button class="flour-btn" id="flour-add" aria-label="Add flour">+</button>
          </div>
        </div>
      </div>


      <section id="saves-section" hidden>
        <p class="saves-heading">Saved</p>
        <div id="saves-list"></div>
      </section>
    </main>

  </div>

  <footer>
    <span>&copy; Jack Beanland 2026 - <a href="https://github.com/jbeanland/dough-calculator" target="_blank" rel="noopener" aria-label="GitHub">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605 2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12Z"></path>
          </svg>
        </a>
    </span>
  </footer>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
